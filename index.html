<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анкета — лабораторная работа 4</title>
  <style>
    body { margin: 8px; font-family: "Times New Roman", Times, serif; color: #000; background: #fff; }
    h1 { font-size: 32px; margin: 0 0 24px; }
    form { max-width: 490px; }
    .field { display: grid; grid-template-columns: 162px minmax(0, 305px); align-items: center; margin-bottom: 9px; min-height: 22px; }
    .field > label:first-child, .field > .heading { font-weight: bold; padding-left: 6px; }
    .field input[type="text"], .field input[type="tel"], .field input[type="email"], .field input[type="password"] { box-sizing: border-box; width: 298px; max-width: 100%; }
    .field input[type="number"] { width: 158px; }
    .field textarea { box-sizing: border-box; width: 305px; max-width: 100%; height: 145px; resize: vertical; }
    .field select[name="city"] { width: 93px; }
    .field select[name="status"] { width: 90px; }
    .field input[type="range"] { width: 160px; vertical-align: middle; }
    .field input[type="color"] { width: 64px; height: 32px; padding: 2px; }
    .choices label { white-space: nowrap; }
    .choices input { vertical-align: middle; }
    .mood { display: flex; align-items: center; gap: 5px; }
    .mood .face { font-size: 21px; }
    .buttons { display: grid; grid-template-columns: 162px auto; padding-left: 6px; }
    .buttons input { justify-self: start; }
    #message { font-family: Arial, sans-serif; font-size: 13px; margin-top: 12px; }
    @media (max-width: 480px) {
      .field { grid-template-columns: 135px minmax(0, 1fr); }
      .field input[type="text"], .field input[type="tel"], .field input[type="email"], .field input[type="password"], .field textarea { width: 100%; }
      .buttons { grid-template-columns: 135px auto; }
      .field > label:first-child, .field > .heading { padding-left: 0; }
    }
  </style>
</head>
<body>
  <h1>Анкета</h1>
  <form id="questionnaire" action="#" method="post">
    <div class="field"><label for="fullname">ФИО</label><input id="fullname" name="fullname" type="text" value="Дильмаев Мансур Ахмедович" required></div>
    <div class="field"><label for="photo">Фотография</label><input id="photo" name="photo" type="file" accept="image/*"></div>
    <div class="field"><span class="heading" id="gender-label">Пол</span><div class="choices" role="group" aria-labelledby="gender-label"><label><input type="radio" name="gender" value="male" checked> М</label> <label><input type="radio" name="gender" value="female"> Ж</label></div></div>
    <div class="field"><span class="heading">Семейное положение</span><label><input type="checkbox" name="married" checked> женат / замужем</label></div>
    <div class="field"><label for="birthday">Дата рождения</label><input id="birthday" name="birthday" type="date" value="2000-01-01"></div>
    <div class="field"><label for="age">Возраст</label><input id="age" name="age" type="number" min="0" max="100" value="18"></div>
    <div class="field"><label for="phone">Телефон</label><input id="phone" name="phone" type="tel" value="+7 123 456 7890"></div>
    <div class="field"><label for="email">E-Mail</label><input id="email" name="email" type="email" value="ivan@ivanov.ru"></div>
    <div class="field"><label for="status">Статус</label><select id="status" name="status"><option>Школьник</option><option selected>Студент</option><option>Работник</option></select></div>
    <div class="field"><label for="city">Город</label><select id="city" name="city" size="4"><option>Москва</option><option>Краснодар</option><option selected>Майкоп</option><option>Сочи</option></select></div>
    <div class="field"><label for="bio">Биография</label><textarea id="bio" name="bio">1. Родился
2. Ясли
3. Детский сад
4. Школа
5. Универ</textarea></div>
    <div class="field"><label for="mood">Настроение</label><div class="mood"><span class="face" aria-hidden="true">☹️</span><input id="mood" name="mood" type="range" min="0" max="10" value="7"><span class="face" aria-hidden="true">🙂</span></div></div>
    <div class="field"><label for="color">Любимый цвет</label><input id="color" name="color" type="color" value="#00ff00"></div>
    <div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" required autocomplete="new-password"></div>
    <div class="buttons"><input type="submit" value="Отправить"><input type="reset" value="Очистить"></div>
    <p id="message" role="status" aria-live="polite"></p>
  </form>
  <script>
    const form = document.getElementById('questionnaire');
    const message = document.getElementById('message');
    form.addEventListener('submit', function(event) {
      event.preventDefault();
      message.textContent = 'Форма заполнена корректно. Это учебная страница: данные никуда не отправляются.';
    });
    form.addEventListener('reset', function() { message.textContent = ''; });
  </script>
</body>
</html>
